services:
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes: ["edge_data:/data"]
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: http://localhost:8000 }
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  edge_data:
